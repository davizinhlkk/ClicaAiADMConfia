<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jhon, quer namorar comigo? ❤️</title>
  <style>
    /* RESET E ESTILOS BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Evita rolagens indesejadas no celular */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* CORAÇÕES FLUTUANTES DE FUNDO */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart-bg {
      position: absolute;
      color: rgba(255, 255, 255, 0.5);
      animation: float 6s infinite linear;
      font-size: 20px;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* CARTÃO PRINCIPAL */
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
      width: 90%;
      max-width: 400px;
      z-index: 2;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    h1 {
      color: #e63946;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #555;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    .message {
      color: #d62828;
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    /* CONTAINER DOS BOTÕES */
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      min-height: 50px;
      position: relative;
    }

    /* ESTILO DOS BOTÕES */
    .btn {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, background-color 0.2s ease;
      touch-action: manipulation;
    }

    .btn-sim {
      background-color: #ff4b2b;
      color: white;
    }

    .btn-sim:active {
      transform: scale(0.95);
    }

    .btn-nao {
      background-color: #a8adc1;
      color: white;
    }

    /* CLASSE PARA BOTÕES EM POSICIONAMENTO ABSOLUTO (FUGINDO) */
    .btn-fixed {
      position: fixed !important;
      z-index: 999;
      transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* TELA FINAL DE COMEMORAÇÃO */
    .final-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .final-title {
      font-size: 2.2rem;
      color: #e63946;
      margin-bottom: 15px;
      animation: pulse 1s infinite alternate;
    }

    .final-sub {
      font-size: 1.3rem;
      color: #4a4a4a;
      font-weight: 600;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* CORAÇÕES EXPLOSIVOS NA VITÓRIA */
    .heart-burst {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 1000;
      animation: burst 1.5s forwards ease-out;
    }

    @keyframes burst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.8) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <!-- ELEMENTOS DE FUNDO -->
  <div class="bg-hearts" id="bgHearts"></div>

  <!-- CARTÃO PRINCIPAL -->
  <div class="card" id="mainCard">
    <div id="quizContent">
      <h1 id="titleText">Jhon, quer namorar comigo? ❤️</h1>
      <p class="subtitle">Escolha com sabedoria... 😏</p>
      <div class="message" id="messageBox"></div>

      <div class="btn-container" id="btnContainer">
        <button class="btn btn-sim" id="btnSim">SIM ❤️</button>
        <button class="btn btn-nao" id="btnNao">NÃO</button>
      </div>
    </div>

    <!-- TELA FINAL -->
    <div class="final-screen" id="finalScreen">
      <h2 class="final-title">EU SABIA! ❤️😭</h2>
      <p class="final-sub" id="finalPairText">Jhon + ❤️ = uma história começando...</p>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURAÇÕES (FÁCIL ALTERAÇÃO)
    // ==========================================
    const NOME_PESSOA = "Jhon";
    const CLIQUES_NECESSARIOS_SIM = 17;

    // APLICAR NOME PERSONALIZADO
    document.getElementById('titleText').innerText = `${NOME_PESSOA}, quer namorar comigo? ❤️`;
    document.getElementById('finalPairText').innerText = `${NOME_PESSOA} + ❤️ = uma história começando...`;

    // CONTADORES INTERNOS (NUNCA EXIBIDOS AO USUÁRIO)
    let simClickCount = 0;
    let naoClickCount = 0;

    // ELEMENTOS DO DOM
    const btnSim = document.getElementById('btnSim');
    const btnNao = document.getElementById('btnNao');
    const messageBox = document.getElementById('messageBox');
    const quizContent = document.getElementById('quizContent');
    const finalScreen = document.getElementById('finalScreen');

    // MENSAGEM DO PRIMEIRO CLIQUE NO SIM
    const MENSAGEM_FUGA_SIM = "Se você realmente me ama, continue clicando até conseguir. Uma hora eu vou te obedecer. 😈❤️";

    // ------------------------------------------
    // FUNÇÃO DE MOVER BOTÃO ALEATORIAMENTE (SEM SAIR DA TELA)
    // ------------------------------------------
    function moverBotaoAleatoriamente(botao) {
      if (!botao.classList.contains('btn-fixed')) {
        botao.classList.add('btn-fixed');
      }

      // Dimensões da janela
      const winWidth = window.innerWidth;
      const winHeight = window.innerHeight;

      // Dimensões do próprio botão
      const btnWidth = botao.offsetWidth;
      const btnHeight = botao.offsetHeight;

      // Margem de segurança das bordas da tela
      const padding = 20;

      // Cálculo dos limites máximos permitidos
      const maxX = winWidth - btnWidth - padding;
      const maxY = winHeight - btnHeight - padding;

      // Posições aleatórias garantidas dentro da viewport visível
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      botao.style.left = `${randomX}px`;
      botao.style.top = `${randomY}px`;
    }

    // ------------------------------------------
    // LÓGICA DO BOTÃO SIM
    // ------------------------------------------
    function handleSimClick(e) {
      e.preventDefault();
      simClickCount++;

      if (simClickCount === 1) {
        messageBox.innerText = MENSAGEM_FUGA_SIM;
      }

      if (simClickCount < CLIQUES_NECESSARIOS_SIM) {
        moverBotaoAleatoriamente(btnSim);
      } else {
        // 17º Clique: Aceitação do pedido
        aceitarPedido();
      }
    }

    btnSim.addEventListener('click', handleSimClick);
    btnSim.addEventListener('touchstart', function(e) {
      // Garante acionamento preciso em telas sensíveis ao toque
      handleSimClick(e);
    });

    // ------------------------------------------
    // LÓGICA DO BOTÃO NÃO
    // ------------------------------------------
    function handleNaoClick(e) {
      e.preventDefault();
      naoClickCount++;

      if (naoClickCount === 1 || naoClickCount === 2) {
        moverBotaoAleatoriamente(btnNao);
      } else if (naoClickCount >= 3) {
        // Na 3ª tentativa, transforma-se no botão SIM
        btnNao.innerText = "SIM ❤️";
        btnNao.className = "btn btn-sim btn-fixed";
        messageBox.innerText = "O NÃO cansou de fugir... agora só existe uma opção. 😂❤️";
        
        // Atualiza a função do botão para agir diretamente como aceite
        btnNao.onclick = btnNao.ontouchstart = function(evt) {
          evt.preventDefault();
          aceitarPedido();
        };
      }
    }

    btnNao.addEventListener('click', handleNaoClick);
    btnNao.addEventListener('touchstart', handleNaoClick);

    // ------------------------------------------
    // FINALIZAR E COMEMORAR
    // ------------------------------------------
    function aceitarPedido() {
      // Esconder os botões completamente
      btnSim.style.display = 'none';
      btnNao.style.display = 'none';

      // Esconder o conteúdo inicial e exibir a tela final
      quizContent.style.display = 'none';
      finalScreen.style.display = 'flex';

      // Disparar animação de corações explosivos
      criarExplosaoDeCoracoes();
    }

    // ANIMACÃO DE CORAÇÕES NA VITÓRIA
    function criarExplosaoDeCoracoes() {
      const quantidade = 40;
      for (let i = 0; i < quantidade; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart-burst');
        heart.innerHTML = ['❤️', '💖', '💕', '💗', '😍'][Math.floor(Math.random() * 5)];
        
        // Posição inicial no centro
        heart.style.left = '50vw';
        heart.style.top = '50vh';

        // Trajetória aleatória em 360 graus
        const angle = Math.random() * Math.PI * 2;
        const velocity = 100 + Math.random() * 250;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;

        heart.style.setProperty('--tx', `${tx}px`);
        heart.style.setProperty('--ty', `${ty}px`);

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 1500);
      }
    }

    // CORAÇÕES SUAVES FLUTUANDO NO FUNDO DA TELA
    function gerarCoracoesFundo() {
      const container = document.getElementById('bgHearts');
      const totalCoracoes = 15;

      for (let i = 0; i < totalCoracoes; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart-bg');
        heart.innerHTML = '❤️';
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDelay = `${Math.random() * 5}s`;
        heart.style.animationDuration = `${4 + Math.random() * 4}s`;
        container.appendChild(heart);
      }
    }

    gerarCoracoesFundo();
  </script>
</body>
</html>
