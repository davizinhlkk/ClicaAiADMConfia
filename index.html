<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhon, quer namorar comigo? ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e8 0%, #fff9f5 50%, #ffc0e0 100%);
            overflow: hidden;
            position: relative;
        }

        /* Corações flutuantes de fundo */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            opacity: 0.15;
            animation: float 15s infinite ease-in;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.15;
            }
            50% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Cartão Principal */
        .card-container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            text-align: center;
            z-index: 10;
            max-width: 90%;
            width: 100%;
            position: relative;
        }

        .title {
            font-size: 32px;
            color: #ff1493;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .message {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        /* Botões */
        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            position: absolute;
        }

        #btnSim {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 20, 147, 0.4);
        }

        #btnSim:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 20, 147, 0.6);
        }

        #btnNao {
            background: linear-gradient(135deg, #666, #999);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        #btnNao:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Animação de movimento do botão */
        @keyframes moveButton {
            0% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .button-escape {
            animation: moveButton 0.4s ease-out;
        }

        /* Tela Final */
        .final-screen {
            display: none;
            text-align: center;
            z-index: 15;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .final-title {
            font-size: 48px;
            color: #ff1493;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .final-text {
            font-size: 24px;
            color: #ff69b4;
            margin-bottom: 30px;
        }

        .celebration-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 12;
        }

        .celebration-heart {
            position: absolute;
            font-size: 40px;
            animation: celebrate 3s ease-out forwards;
        }

        @keyframes celebrate {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-150px) scale(0.5);
            }
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .card-container {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .message {
                font-size: 14px;
            }

            button {
                padding: 12px 25px;
                font-size: 16px;
            }

            .final-title {
                font-size: 36px;
            }

            .final-text {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Corações flutuantes de fundo -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- Cartão Principal -->
    <div class="card-container">
        <div id="mainContent">
            <h1 class="title">Jhon, quer namorar comigo? ❤️</h1>
            <p class="subtitle">Escolha com sabedoria... 😏</p>
            <div class="message"></div>
            <div class="buttons-container">
                <button id="btnSim">SIM ❤️</button>
                <button id="btnNao">NÃO</button>
            </div>
        </div>

        <!-- Tela Final -->
        <div class="final-screen" id="finalScreen">
            <div class="final-title">EU SABIA! ❤️😭</div>
            <div class="final-text">Jhon + ❤️ = uma história começando...</div>
        </div>
    </div>

    <!-- Corações de celebração -->
    <div class="celebration-hearts" id="celebrationHearts"></div>

    <script>
        // ===== CONFIGURAÇÕES =====
        const NAME = "Jhon"; // Altere o nome aqui
        const MAX_CLICKS_SIM = 17; // Altere o número de cliques aqui
        
        // ===== ESTADO =====
        let simsClicks = 0;
        let naoAttempts = 0;
        let accepted = false;
        
        // ===== ELEMENTOS DOM =====
        const btnSim = document.getElementById('btnSim');
        const btnNao = document.getElementById('btnNao');
        const messageDiv = document.querySelector('.message');
        const mainContent = document.getElementById('mainContent');
        const finalScreen = document.getElementById('finalScreen');
        const floatingHearts = document.getElementById('floatingHearts');
        const celebrationHearts = document.getElementById('celebrationHearts');

        // ===== INICIALIZAÇÃO =====
        function init() {
            // Gerar corações flutuantes de fundo
            generateFloatingHearts();
            
            // Posicionar botões inicialmente
            resetButtonPositions();
            
            // Event listeners
            btnSim.addEventListener('click', handleSimClick);
            btnNao.addEventListener('click', handleNaoClick);
        }

        // ===== CORAÇÕES FLUTUANTES =====
        function generateFloatingHearts() {
            for (let i = 0; i < 12; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.animationDuration = (10 + Math.random() * 10) + 's';
                floatingHearts.appendChild(heart);
            }
        }

        // ===== POSICIONAMENTO DOS BOTÕES =====
        function resetButtonPositions() {
            // Posicionar botões lado a lado no centro (inicial)
            const container = document.querySelector('.buttons-container');
            btnSim.style.position = 'static';
            btnNao.style.position = 'static';
        }

        function getRandomPosition() {
            const positions = [
                { top: '20%', left: '10%' },
                { top: '20%', right: '10%', left: 'auto' },
                { top: '50%', left: '10%' },
                { top: '50%', right: '10%', left: 'auto' },
                { bottom: '20%', left: '10%', top: 'auto' },
                { bottom: '20%', right: '10%', left: 'auto', top: 'auto' },
                { top: '50%', left: '50%', transform: 'translate(-50%, -50%)' },
                { top: '30%', left: '70%', transform: 'translateY(-50%)' },
                { top: '70%', left: '30%', transform: 'translateY(-50%)' }
            ];

            return positions[Math.floor(Math.random() * positions.length)];
        }

        function moveButton(button) {
            const position = getRandomPosition();
            button.style.position = 'fixed';
            button.style.top = position.top || 'auto';
            button.style.left = position.left || 'auto';
            button.style.right = position.right || 'auto';
            button.style.bottom = position.bottom || 'auto';
            if (position.transform) {
                button.style.transform = position.transform;
            }
            button.classList.add('button-escape');
            setTimeout(() => button.classList.remove('button-escape'), 400);
        }

        // ===== CLIQUE NO BOTÃO SIM =====
        function handleSimClick() {
            if (accepted) return;

            simsClicks++;

            if (simsClicks === 1) {
                // Primeiro clique: mover botão e mostrar mensagem
                messageDiv.textContent = "Se você realmente me ama, continue clicando até conseguir. Uma hora eu vou te obedecer. 😈❤️";
                moveButton(btnSim);
            } else if (simsClicks < MAX_CLICKS_SIM) {
                // Cliques intermediários: continuar fugindo
                moveButton(btnSim);
            } else if (simsClicks === MAX_CLICKS_SIM) {
                // 17º clique: aceitar
                acceptProposal();
            }
        }

        // ===== CLIQUE NO BOTÃO NÃO =====
        function handleNaoClick() {
            if (accepted) return;

            naoAttempts++;

            if (naoAttempts === 1 || naoAttempts === 2) {
                // Primeiras duas tentativas: fugir
                moveButton(btnNao);
            } else if (naoAttempts === 3) {
                // Terceira tentativa: transformar em SIM
                messageDiv.textContent = "O NÃO cansou de fugir... agora só existe uma opção. 😂❤️";
                btnNao.textContent = "SIM ❤️";
                btnNao.id = "btnSimFinal";
                btnNao.style.position = 'static';
                btnNao.style.left = 'auto';
                btnNao.style.right = 'auto';
                btnNao.style.top = 'auto';
                btnNao.style.bottom = 'auto';
                btnNao.style.transform = 'none';
                btnNao.removeEventListener('click', handleNaoClick);
                btnNao.addEventListener('click', acceptProposal);
            }
        }

        // ===== ACEITAR PROPOSTA =====
        function acceptProposal() {
            if (accepted) return;
            accepted = true;

            // Esconder conteúdo principal
            mainContent.style.display = 'none';
            finalScreen.style.display = 'block';

            // Criar corações de celebração
            createCelebrationHearts();
        }

        // ===== CORAÇÕES DE CELEBRAÇÃO =====
        function createCelebrationHearts() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'celebration-heart';
                    heart.textContent = '❤️';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = '100%';
                    celebrationHearts.appendChild(heart);

                    setTimeout(() => heart.remove(), 3000);
                }, i * 100);
            }
        }

        // ===== INICIAR =====
        init();
    </script>
</body>
</html>
